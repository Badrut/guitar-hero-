<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Shooter</title>

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #1f1c2c, #928dab);
        }

        .container {
            display: flex;
            width: 90%;
            max-width: 1200px;
            height: 90vh;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        canvas {
            flex: 3;
            background-color: black;
        }

        .sidebar {
            flex: 1;
            background-color: #f4f4f4;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-bottom: 10px;
            color: #333;
            text-transform: uppercase;
            font-weight: bold;
        }

        .leaderboard-list {
            width: 100%;
            list-style: none;
            padding: 0;
        }

        .leaderboard-list li {
            background: white;
            margin: 8px 0;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .btn-logout {
            width: 100%;
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }

        .btn-logout:hover {
            background: #d43f3f;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: 100vh;
            }

            .sidebar {
                flex: none;
                height: auto;
                width: 100%;
                padding: 15px;
            }

            canvas {
                height: 70vh;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        <div class="sidebar">
            <h2>Leaderboard</h2>
            <ul id="leaderboard-list" class="leaderboard-list"></ul>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <script src="index.js"></script>
    <script>
        if (!localStorage.getItem("player")) {
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
